<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沙漠之鷹</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2214%22%20fill=%22%23c9a15a%22/%3E%3Cg%20stroke=%22%231a1714%22%20stroke-width=%224%22%20stroke-linecap=%22round%22%20fill=%22none%22%3E%3Cline%20x1=%2220%22%20y1=%2214%22%20x2=%2220%22%20y2=%2250%22/%3E%3Cline%20x1=%2232%22%20y1=%2214%22%20x2=%2232%22%20y2=%2250%22/%3E%3Cline%20x1=%2244%22%20y1=%2214%22%20x2=%2244%22%20y2=%2250%22/%3E%3Cpath%20d=%22M12%2032%20C18%2026,%2024%2038,%2032%2032%20S46%2026,%2052%2032%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2214%22%20fill=%22%23c9a15a%22/%3E%3Cg%20stroke=%22%231a1714%22%20stroke-width=%224%22%20stroke-linecap=%22round%22%20fill=%22none%22%3E%3Cline%20x1=%2220%22%20y1=%2214%22%20x2=%2220%22%20y2=%2250%22/%3E%3Cline%20x1=%2232%22%20y1=%2214%22%20x2=%2232%22%20y2=%2250%22/%3E%3Cline%20x1=%2244%22%20y1=%2214%22%20x2=%2244%22%20y2=%2250%22/%3E%3Cpath%20d=%22M12%2032%20C18%2026,%2024%2038,%2032%2032%20S46%2026,%2052%2032%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe6; --ink:#2a2622; --muted:#7d7266; --line:#ddd3c4; --accent:#8a6d3b; --panel:#fbf8f2;
}
[data-theme="dark"]{
  --bg:#1a1714; --ink:#e8e0d4; --muted:#9a8f82; --line:#3a332c; --accent:#c9a15a; --panel:#221e1a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC",serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px}
button:hover{color:var(--ink);border-color:var(--accent)}
.progress{position:fixed;top:0;left:0;height:2px;background:var(--accent);width:0;z-index:5}
.bar{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 20px;z-index:4}
.bar .b{flex:1;font-size:15px;letter-spacing:.1em;display:flex;align-items:center;gap:10px;color:var(--ink)}
.bar .logo{width:22px;height:22px}
.bar .b small{color:var(--muted);margin-left:8px;letter-spacing:0;font-size:12px}
.wrap{max-width:680px;margin:0 auto;padding:40px 24px 120px}
/* 目錄 */
.cover{text-align:center;padding:40px 0 30px}
.cover h1{font-size:34px;letter-spacing:.2em;margin:0 0 6px;font-weight:700}
.cover .au{color:var(--muted);letter-spacing:.2em}
.cover .n{color:var(--muted);font-size:13px;margin-top:14px}
.toc a{display:flex;gap:14px;padding:14px 6px;border-bottom:1px solid var(--line);color:var(--ink);align-items:baseline}
.toc a:hover{color:var(--accent)}
.toc .o{color:var(--muted);font-size:13px;min-width:44px}
.toc .t{flex:1}
.toc .w{color:var(--muted);font-size:12px}
/* 內文 */
.chapter h2{text-align:center;font-size:22px;letter-spacing:.1em;margin:0 0 6px}
.chapter .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:40px}
.body{font-size:var(--fs,18px);line-height:2}
.body p{margin:0 0 .8em;text-indent:2em}
.body p.br{text-align:center;text-indent:0;color:var(--muted);letter-spacing:.6em;margin:1.6em 0}
.nav{display:flex;justify-content:space-between;margin-top:60px;padding-top:20px;border-top:1px solid var(--line)}
.nav a{padding:8px 0}
.empty{text-align:center;color:var(--muted);padding:80px 0}
.empty button{margin-top:14px}
.tools{display:flex;gap:6px}
@media (max-width:600px){.wrap{padding:24px 18px 100px}.cover h1{font-size:28px}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="bar">
  <a href="#" class="b" onclick="go('');return false"><img class="logo" src="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2214%22%20fill=%22%23c9a15a%22/%3E%3Cg%20stroke=%22%231a1714%22%20stroke-width=%224%22%20stroke-linecap=%22round%22%20fill=%22none%22%3E%3Cline%20x1=%2220%22%20y1=%2214%22%20x2=%2220%22%20y2=%2250%22/%3E%3Cline%20x1=%2232%22%20y1=%2214%22%20x2=%2232%22%20y2=%2250%22/%3E%3Cline%20x1=%2244%22%20y1=%2214%22%20x2=%2244%22%20y2=%2250%22/%3E%3Cpath%20d=%22M12%2032%20C18%2026,%2024%2038,%2032%2032%20S46%2026,%2052%2032%22/%3E%3C/g%3E%3C/svg%3E" alt=""><span id="bookTitle">沙漠之鷹</span><small id="bookAuthor"></small></a>
  <div class="tools">
    <button onclick="zoom(-1)" title="縮小">A−</button>
    <button onclick="zoom(1)" title="放大">A+</button>
    <button onclick="toggleTheme()" title="日夜">◐</button>
  </div>
</div>
<div class="wrap" id="view"><div class="empty">載入中…</div></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbwWw3njCkyrj4P1I2SdnY3Vcy9p9eeoTGaQYGoW_eZ_fmFoBg--qAo2s5DRmtdGiugx9g/exec';
var DATA = null;     // 目錄（不含全文）
var BODY = {};       // 已讀過的章節全文（只在這次開啟期間）
var fs = Number(localStorage.getItem('loom_reader_fs') || 18);
var theme = localStorage.getItem('loom_reader_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
applyTheme(); applyFs();

// Apps Script 偶爾回一頁 HTML 錯誤頁而不是 JSON；自動重試兩次
function getJson(url, tries) {
  tries = tries === undefined ? 2 : tries;
  return fetch(url).then(function (r) { return r.text(); }).then(function (t) {
    try { return JSON.parse(t); } catch (_) { throw new Error('__HTML__'); }
  }).catch(function (e) {
    if (tries > 0 && (e.message === '__HTML__' || /Failed to fetch|NetworkError/i.test(e.message))) {
      return new Promise(function (res) { setTimeout(res, 1500); }).then(function () { return getJson(url, tries - 1); });
    }
    if (e.message === '__HTML__') throw new Error('後端暫時沒回應，請稍後再試');
    throw e;
  });
}

function loadToc() {
  return getJson(API + '?action=public').then(function (j) {
    if (!j.ok) throw new Error(j.error);
    DATA = j;
    document.getElementById('bookTitle').textContent = j.book || '沙漠之鷹';
    document.getElementById('bookAuthor').textContent = j.author || '';
    document.title = j.book || '沙漠之鷹';
    render();
  }).catch(function (e) {
    document.getElementById('view').innerHTML = '<div class="empty">讀不到內容：' + esc(e.message) + '<br><button onclick="location.reload()">重試</button></div>';
  });
}
loadToc();

function loadBody(id) {
  if (BODY[id] !== undefined) return Promise.resolve(BODY[id]);
  return getJson(API + '?action=read&id=' + encodeURIComponent(id)).then(function (j) {
    if (!j.ok) throw new Error(j.error);
    BODY[id] = j.chapter.body || '';
    return BODY[id];
  });
}

window.addEventListener('hashchange', render);
function go(id) { location.hash = id ? 'ch=' + id : ''; }
function hashId() { var m = location.hash.match(/ch=([^&]+)/); return m ? m[1] : ''; }

function render() {
  if (!DATA) return;
  var id = hashId();
  var view = document.getElementById('view');
  window.scrollTo(0, 0);
  if (!id) return renderToc(view);
  var i = DATA.chapters.map(function (c) { return String(c.id); }).indexOf(id);
  if (i === -1) return renderToc(view);
  var c = DATA.chapters[i], prev = DATA.chapters[i - 1], next = DATA.chapters[i + 1];
  var head = '<div class="chapter"><h2>' + esc(c.title) + '</h2><div class="sub">' + (c.word_count || 0) + ' 字</div>';
  var nav = '<div class="nav"><span>' + (prev ? '<a href="#ch=' + prev.id + '">← ' + esc(prev.title) + '</a>' : '') + '</span><a href="#">目錄</a><span>' + (next ? '<a href="#ch=' + next.id + '">' + esc(next.title) + ' →</a>' : '') + '</span></div></div>';

  if (BODY[c.id] === undefined) view.innerHTML = head + '<div class="empty">正在載入這一章…</div>' + nav;
  loadBody(c.id).then(function (body) {
    if (hashId() !== String(c.id)) return;   // 讀的這段時間已經換頁，不要蓋掉
    var h = head + '<div class="body">';
    String(body || '').split(/\n+/).forEach(function (line) {
      line = line.replace(/^[\s\u3000]+|\s+$/g, '');
      if (!line) return;
      if (/^[\*＊\-—─]{3,}$/.test(line)) h += '<p class="br">✦ ✦ ✦</p>';
      else h += '<p>' + esc(line) + '</p>';
    });
    view.innerHTML = h + '</div>' + nav;
    localStorage.setItem('loom_reader_last', c.id);
    if (next) loadBody(next.id).catch(function () {});   // 悄悄預讀下一章
  }).catch(function (e) {
    if (hashId() !== String(c.id)) return;
    view.innerHTML = head + '<div class="empty">這一章讀不到：' + esc(e.message) + '<br><button onclick="render()">重試</button></div>' + nav;
  });
}

function renderToc(view) {
  var last = localStorage.getItem('loom_reader_last');
  var total = DATA.chapters.reduce(function (s, c) { return s + (Number(c.word_count) || 0); }, 0);
  var h = '<div class="cover"><h1>' + esc(DATA.book || '') + '</h1><div class="au">' + esc(DATA.author || '') + '</div><div class="n">' + DATA.chapters.length + ' 章 · ' + total + ' 字' + (last && DATA.chapters.some(function (c) { return String(c.id) === last; }) ? ' · <a href="#ch=' + last + '">繼續上次</a>' : '') + '</div></div>';
  if (!DATA.chapters.length) h += '<div class="empty">還沒有公開的章節。</div>';
  h += '<div class="toc">' + DATA.chapters.map(function (c) {
    return '<a href="#ch=' + c.id + '"><span class="o">' + pad(c.order) + '</span><span class="t">' + esc(c.title) + '</span><span class="w">' + (c.word_count || 0) + ' 字</span></a>';
  }).join('') + '</div>';
  view.innerHTML = h;
}
function pad(n) { n = Number(n) || 0; return (n < 10 ? '0' : '') + n; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function zoom(d) { fs = Math.max(14, Math.min(26, fs + d)); localStorage.setItem('loom_reader_fs', fs); applyFs(); }
function applyFs() { document.documentElement.style.setProperty('--fs', fs + 'px'); }
function toggleTheme() { theme = theme === 'dark' ? 'light' : 'dark'; localStorage.setItem('loom_reader_theme', theme); applyTheme(); }
function applyTheme() { document.documentElement.setAttribute('data-theme', theme); }
window.addEventListener('scroll', function () {
  var h = document.documentElement, p = h.scrollHeight - h.clientHeight;
  document.getElementById('progress').style.width = (p > 0 ? (h.scrollTop / p * 100) : 0) + '%';
});
</script>
</body>
</html>
