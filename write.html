<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom · 作者端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1714; --panel:#221e1a; --panel2:#2a2520; --line:#3a332c;
  --ink:#e8e0d4; --muted:#9a8f82; --dim:#6c6257;
  --accent:#c9a15a; --accent2:#8a6d3b; --danger:#c46a5a; --ok:#7da37a;
  --serif:"Noto Serif TC",serif; --sans:"Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
button{font-family:inherit;font-size:13px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent2)}
button.primary{background:var(--accent);color:#1a1714;border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger);border-color:var(--line)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink)}
input,select,textarea{font-family:inherit;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.6}
label{display:block;color:var(--muted);font-size:12px;margin:8px 0 3px}
.app{display:grid;grid-template-columns:230px 1fr 300px;height:100vh}
.app.focus{grid-template-columns:0 1fr 0}
.app.focus .left,.app.focus .right{display:none}
/* 左欄 */
.left{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-family:var(--serif);font-size:18px;color:var(--accent);letter-spacing:.08em}
.brand small{color:var(--muted)}
.chapters{flex:1;overflow:auto;padding:6px}
.ch{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.ch:hover{background:var(--panel2)}
.ch.active{background:var(--panel2);border-left:2px solid var(--accent)}
.ch .n{color:var(--dim);font-size:12px;min-width:22px}
.ch .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .s{font-size:11px;color:var(--muted)}
.ch .s.pub{color:var(--ok)}
.leftfoot{padding:10px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
/* 中欄 */
.center{display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.topbar .title{font-family:var(--serif);font-size:16px;flex:1;background:transparent;border:none;border-bottom:1px dashed transparent;padding:4px 0;border-radius:0}
.topbar .title:focus{outline:none;border-bottom-color:var(--accent2)}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.dirty{color:var(--accent)}
.status.err{color:var(--danger)}
.banner{background:#3a2e1c;color:var(--accent);padding:8px 16px;font-size:13px;display:none;gap:10px;align-items:center}
.banner.show{display:flex}
.paper{flex:1;overflow:auto;padding:40px 0 120px}
.sheet{max-width:720px;margin:0 auto;padding:0 32px;font-family:var(--serif);font-size:18px;line-height:1.9;color:var(--ink);outline:none;min-height:60vh;caret-color:var(--accent)}
.sheet p{margin:0 0 .6em;text-indent:2em}
.sheet p:empty::before{content:"\200b"}
.sheet.empty::before{content:"從這裡開始寫。Enter 換段，Ctrl+S 存到雲端。";color:var(--dim);text-indent:2em;display:block}
.bottombar{display:flex;gap:16px;padding:6px 16px;border-top:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted);align-items:center}
.bottombar .sp{flex:1}
/* 右欄 */
.right{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:none;border-radius:0;background:transparent;color:var(--muted);padding:10px 0;font-size:12px}
.tabs button.on{color:var(--accent);border-bottom:2px solid var(--accent)}
.pane{flex:1;overflow:auto;padding:12px;display:none}
.pane.on{display:block}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card h4{margin:0 0 2px;font-size:13px;font-weight:600}
.card .sub{font-size:11px;color:var(--muted)}
.card .body{display:none;white-space:pre-wrap;font-size:12.5px;line-height:1.6;margin-top:8px;color:var(--ink)}
.card.open .body{display:block}
.card .acts{display:none;gap:6px;margin-top:8px}
.card.open .acts{display:flex}
.card.done h4{color:var(--dim);text-decoration:line-through}
.cat{display:inline-block;font-size:10px;color:var(--accent);border:1px solid var(--accent2);border-radius:4px;padding:0 5px;margin-right:6px}
.filter{display:flex;gap:6px;margin-bottom:10px}
.filter input,.filter select{font-size:12px;padding:5px 8px}
.meta .row{display:flex;gap:6px}
.meta .row>*{flex:1}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:12px}
.chk input{width:auto}
/* 日曆 */
.cal{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin:8px 0 12px}
.cal i{aspect-ratio:1;border-radius:2px;background:var(--line);display:block}
.cal i.l1{background:#3f5a3c}.cal i.l2{background:#5b8455}.cal i.l3{background:#7da37a}.cal i.l4{background:#a8d3a3}
.log{font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.log b{color:var(--ok)} .log b.neg{color:var(--danger)}
.log .d{color:var(--dim);margin-right:6px}
/* 遮罩 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10}
.modal.show{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(520px,92vw);max-height:90vh;overflow:auto}
.box h3{margin:0 0 6px;font-family:var(--serif);color:var(--accent)}
.box .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.hint{color:var(--muted);font-size:12px}
kbd{font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--muted)}
.menu{display:none}
@media (max-width:900px){.menu{display:inline-block}.app{grid-template-columns:1fr}.left,.right{display:none}.app.showLeft .left{display:flex;position:fixed;inset:0;z-index:5}.sheet{font-size:17px;padding:0 20px}}
</style>
</head>
<body>
<div class="app" id="app">

  <aside class="left">
    <div class="brand"><h1 id="bookTitle">Loom</h1><small id="bookAuthor"></small></div>
    <div class="chapters" id="chapterList"></div>
    <div class="leftfoot">
      <button class="primary" onclick="newChapter()">＋ 新增章節</button>
      <button class="ghost" onclick="loadAll()" title="重新讀取">↻</button>
      <button class="ghost" onclick="logout()" title="登出">登出</button>
    </div>
  </aside>

  <main class="center">
    <div class="topbar">
      <button class="ghost menu" onclick="document.getElementById('app').classList.toggle('showLeft')">☰</button>
      <input class="title" id="chTitle" placeholder="章節標題" oninput="markDirty()">
      <span class="status" id="saveStatus">—</span>
      <button onclick="save()" title="Ctrl+S">存檔</button>
      <button class="ghost" onclick="toggleFocus()" title="專注模式（F 鍵）">⛶</button>
    </div>
    <div class="banner" id="docBanner">
      <span>雲端 Doc 比 Loom 的快取新，妳可能直接在 Docs 改過。</span>
      <button onclick="pullDoc()">載入 Doc 版本</button>
      <button class="ghost" onclick="hideBanner()">忽略</button>
    </div>
    <div class="paper" onclick="focusSheet(event)">
      <div class="sheet empty" id="sheet" contenteditable="true" spellcheck="false"></div>
    </div>
    <div class="bottombar">
      <span id="wc">0 字</span>
      <span id="wcToday">今日 +0</span>
      <span class="sp"></span>
      <span>字級 <button class="ghost" onclick="zoom(-1)">−</button><button class="ghost" onclick="zoom(1)">＋</button></span>
      <span><kbd>Ctrl+S</kbd> 存檔 · <kbd>F</kbd> 專注</span>
    </div>
  </main>

  <aside class="right">
    <div class="tabs">
      <button class="on" data-pane="meta" onclick="showPane('meta')">本章</button>
      <button data-pane="chars" onclick="showPane('chars')">角色</button>
      <button data-pane="world" onclick="showPane('world')">世界</button>
      <button data-pane="threads" onclick="showPane('threads')">伏筆</button>
      <button data-pane="log" onclick="showPane('log')">日誌</button>
    </div>

    <div class="pane on meta" id="pane-meta">
      <label>狀態</label>
      <select id="mStatus" onchange="saveMeta()"><option>構思</option><option>草稿</option><option>修改</option><option>完成</option></select>
      <div class="row">
        <div><label>視角</label><input id="mPov" onchange="saveMeta()"></div>
        <div><label>故事內時間</label><input id="mTime" onchange="saveMeta()"></div>
      </div>
      <label>一句話摘要</label>
      <textarea id="mSummary" onchange="saveMeta()"></textarea>
      <div class="chk"><input type="checkbox" id="mPublic" onchange="saveMeta()"><span>公開給讀者端</span></div>
      <div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap">
        <a id="mDoc" href="#" target="_blank" rel="noopener"><button>開啟 Doc</button></a>
        <button onclick="pullDoc()">從 Doc 同步</button>
        <button onclick="moveChapter(-1)">↑ 上移</button>
        <button onclick="moveChapter(1)">↓ 下移</button>
      </div>
      <div style="margin-top:20px"><button class="danger" onclick="deleteChapter()">刪除本章</button></div>
      <p class="hint" style="margin-top:14px">章節 Doc 是稿子真身，Loom 存的是快取。平常在這裡寫；Doc 開來看、分享、翻版本都可以，別兩邊同時改。</p>
    </div>

    <div class="pane" id="pane-chars">
      <div class="filter"><input placeholder="搜尋角色" oninput="renderChars(this.value)"><button onclick="editCard('characters')">＋</button></div>
      <div id="charList"></div>
    </div>

    <div class="pane" id="pane-world">
      <div class="filter">
        <select id="worldCat" onchange="renderWorld()"><option value="">全部類別</option></select>
        <input id="worldQ" placeholder="搜尋" oninput="renderWorld()">
        <button onclick="editCard('world')">＋</button>
      </div>
      <div id="worldList"></div>
    </div>

    <div class="pane" id="pane-threads">
      <div class="filter">
        <select id="threadScope" onchange="renderThreads()"><option value="open">未收</option><option value="chapter">本章</option><option value="all">全部</option></select>
        <button onclick="editCard('threads')">＋</button>
      </div>
      <div id="threadList"></div>
    </div>

    <div class="pane" id="pane-log">
      <div class="hint">寫作日曆（近 13 週）</div>
      <div class="cal" id="cal"></div>
      <textarea id="logNote" placeholder="寫完留一句：寫到哪、卡在哪、下次從哪接。"></textarea>
      <div style="display:flex;justify-content:flex-end;margin-top:6px"><button onclick="addNote()">記一筆</button></div>
      <div id="logList" style="margin-top:10px"></div>
    </div>
  </aside>
</div>

<!-- 口令 -->
<div class="modal" id="passModal">
  <div class="box">
    <h3>Loom</h3>
    <p class="hint">輸入作者口令。只存在這台瀏覽器裡。</p>
    <input id="passInput" type="password" placeholder="口令" onkeydown="if(event.key==='Enter')login()">
    <div class="acts"><button class="primary" onclick="login()">進入</button></div>
    <p class="hint" id="passErr"></p>
  </div>
</div>

<!-- 卡片編輯 -->
<div class="modal" id="cardModal">
  <div class="box">
    <h3 id="cardTitle">編輯</h3>
    <div id="cardForm"></div>
    <div class="acts">
      <button class="danger" id="cardDel" onclick="deleteCard()">刪除</button>
      <span style="flex:1"></span>
      <button onclick="closeCard()">取消</button>
      <button class="primary" onclick="saveCard()">儲存</button>
    </div>
  </div>
</div>

<script>
// ══════════ 設定 ══════════
var API = 'https://script.google.com/macros/s/AKfycbwWw3njCkyrj4P1I2SdnY3Vcy9p9eeoTGaQYGoW_eZ_fmFoBg--qAo2s5DRmtdGiugx9g/exec';
var STATUS_ORDER = ['構思','草稿','修改','完成'];

// ══════════ 狀態 ══════════
var pass = localStorage.getItem('loom_pass') || '';
var DB = { chapters:[], characters:[], world:[], threads:[], log:[], book:'', author:'' };
var cur = null;          // 目前章節（meta + body）
var dirty = false;
var openedWords = 0;     // 開章時字數，算今日新增
var saving = false;
var autosaveTimer = null;
var fontSize = Number(localStorage.getItem('loom_font') || 18);

// ══════════ API ══════════
function apiGet(params) {
  var q = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(API + '?' + q).then(function (r) { return r.json(); }).then(chk);
}
function apiPost(action, data) {
  return fetch(API, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ pass:pass, action:action, data:data }) })
    .then(function (r) { return r.json(); }).then(chk);
}
function chk(j) { if (!j.ok) throw new Error(j.error || '未知錯誤'); return j; }

// ══════════ 登入 ══════════
function login() {
  var p = document.getElementById('passInput').value.trim();
  if (!p) return;
  pass = p;
  document.getElementById('passErr').textContent = '確認中…';
  apiGet({ action:'all', pass:pass }).then(function (j) {
    localStorage.setItem('loom_pass', pass);
    document.getElementById('passModal').classList.remove('show');
    applyAll(j);
  }).catch(function (e) { document.getElementById('passErr').textContent = e.message; });
}
function logout() { localStorage.removeItem('loom_pass'); location.reload(); }

function loadAll() {
  setStatus('讀取中…');
  return apiGet({ action:'all', pass:pass }).then(applyAll).catch(function (e) {
    if (/口令/.test(e.message)) { localStorage.removeItem('loom_pass'); document.getElementById('passModal').classList.add('show'); }
    setStatus(e.message, 'err');
  });
}
function applyAll(j) {
  DB = j; DB.chapters.sort(function (a, b) { return Number(a.order) - Number(b.order); });
  document.getElementById('bookTitle').textContent = j.book || 'Loom';
  document.getElementById('bookAuthor').textContent = j.author || '';
  document.title = (j.book || 'Loom') + ' · 作者端';
  renderChapters(); renderChars(''); renderWorld(); renderThreads(); renderLog();
  setStatus('已同步');
  if (!cur && DB.chapters.length) {
    var last = localStorage.getItem('loom_last');
    var pick = DB.chapters.filter(function (c) { return c.id === last; })[0] || DB.chapters[DB.chapters.length - 1];
    openChapter(pick.id);
  }
}

// ══════════ 章節列表 ══════════
function renderChapters() {
  var el = document.getElementById('chapterList'); el.innerHTML = '';
  DB.chapters.forEach(function (c) {
    var d = document.createElement('div');
    d.className = 'ch' + (cur && cur.id === c.id ? ' active' : '');
    d.innerHTML = '<span class="n">' + pad(c.order) + '</span><span class="t"></span><span class="s' + (c.public ? ' pub' : '') + '">' + (c.public ? '公開' : c.status || '') + '</span>';
    d.querySelector('.t').textContent = c.title || '（未命名）';
    d.onclick = function () { openChapter(c.id); };
    el.appendChild(d);
  });
}
function pad(n) { n = Number(n) || 0; return (n < 10 ? '0' : '') + n; }

function openChapter(id) {
  if (dirty && !confirm('目前章節有未存的修改，要放棄嗎？')) return;
  setStatus('載入中…');
  apiGet({ action:'chapter', id:id, pass:pass }).then(function (j) {
    cur = j.chapter;
    var draft = localStorage.getItem('loom_draft_' + id);
    if (draft && draft !== cur.body && confirm('這台瀏覽器有一份沒送出的草稿，比雲端多 ' + Math.abs(countWords(draft) - countWords(cur.body)) + ' 字。要用草稿嗎？')) cur.body = draft;
    localStorage.setItem('loom_last', id);
    fillEditor(); fillMeta(); renderChapters(); renderThreads();
    dirty = false; setStatus('已同步');
    document.getElementById('docBanner').classList.toggle('show', !!cur.doc_newer);
  }).catch(function (e) { setStatus(e.message, 'err'); });
}

// ══════════ 編輯器 ══════════
var sheet = document.getElementById('sheet');
function fillEditor() {
  document.getElementById('chTitle').value = cur.title || '';
  sheet.innerHTML = '';
  (cur.body || '').split(/\n{2,}|\n/).forEach(function (line) {
    var p = document.createElement('p'); p.textContent = line; sheet.appendChild(p);
  });
  if (!sheet.children.length) sheet.appendChild(document.createElement('p'));
  sheet.style.fontSize = fontSize + 'px';
  openedWords = countWords(cur.body || '');
  updateCount();
}
function readEditor() {
  var lines = [];
  Array.prototype.forEach.call(sheet.childNodes, function (n) {
    var t = (n.innerText !== undefined ? n.innerText : n.textContent).replace(/\u200b/g, '').replace(/\n+$/, '');
    lines.push(t);
  });
  return lines.join('\n').replace(/^\n+|\n+$/g, '');
}
function countWords(text) {
  if (!text) return 0;
  var s = String(text).replace(/\s+/g, '');
  var cjk = (s.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g) || []).length;
  var latin = (String(text).match(/[A-Za-z0-9]+/g) || []).length;
  return cjk + latin;
}
function updateCount() {
  var n = countWords(readEditor());
  document.getElementById('wc').textContent = n + ' 字';
  document.getElementById('wcToday').textContent = '今日 ' + (todayDelta() + (n - openedWords) >= 0 ? '+' : '') + (todayDelta() + (n - openedWords));
  sheet.classList.toggle('empty', n === 0 && !sheet.textContent.trim());
}
function todayDelta() {
  var today = new Date().toLocaleDateString('sv-SE', { timeZone:'Asia/Taipei' });
  return DB.log.filter(function (l) { return String(l.date).slice(0, 10) === today; })
    .reduce(function (s, l) { return s + (Number(l.words_delta) || 0); }, 0);
}
sheet.addEventListener('input', function () { markDirty(); updateCount(); });
sheet.addEventListener('paste', function (e) {
  e.preventDefault();
  var text = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text);
});
document.execCommand('defaultParagraphSeparator', false, 'p');
function focusSheet(e) { if (e.target.classList.contains('paper')) sheet.focus(); }

function markDirty() {
  if (!cur) return;
  dirty = true; setStatus('未存檔', 'dirty');
  try { localStorage.setItem('loom_draft_' + cur.id, readEditor()); } catch (_) {}
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(function () { if (dirty) save(true); }, 45000);
}

function save(quiet) {
  if (!cur || saving) return;
  saving = true; setStatus('存檔中…');
  var body = readEditor();
  var title = document.getElementById('chTitle').value.trim() || '未命名';
  apiPost('saveChapter', { id:cur.id, title:title, body:body }).then(function (j) {
    cur.body = body; cur.title = title; cur.word_count = j.result.word_count;
    dirty = false; saving = false;
    localStorage.removeItem('loom_draft_' + cur.id);
    var c = byId(DB.chapters, cur.id); if (c) { c.title = title; c.word_count = cur.word_count; }
    if (j.result.words_delta) { DB.log.unshift({ date:new Date().toLocaleDateString('sv-SE', { timeZone:'Asia/Taipei' }), chapter_id:cur.id, words_delta:j.result.words_delta, note:'' }); openedWords = countWords(body); renderLog(); }
    renderChapters(); updateCount();
    setStatus('已存檔 ' + new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' }));
  }).catch(function (e) { saving = false; setStatus('存檔失敗：' + e.message, 'err'); });
}
function setStatus(t, cls) { var s = document.getElementById('saveStatus'); s.textContent = t; s.className = 'status ' + (cls || ''); }

// ══════════ 本章資料 ══════════
function fillMeta() {
  document.getElementById('mStatus').value = STATUS_ORDER.indexOf(cur.status) === -1 ? '草稿' : cur.status;
  document.getElementById('mPov').value = cur.pov || '';
  document.getElementById('mTime').value = cur.story_time || '';
  document.getElementById('mSummary').value = cur.summary || '';
  document.getElementById('mPublic').checked = !!cur.public;
  document.getElementById('mDoc').href = cur.doc_url || '#';
}
function saveMeta() {
  if (!cur) return;
  var d = { id:cur.id, status:document.getElementById('mStatus').value, pov:document.getElementById('mPov').value, story_time:document.getElementById('mTime').value, summary:document.getElementById('mSummary').value, public:document.getElementById('mPublic').checked };
  setStatus('更新中…');
  apiPost('saveChapter', d).then(function () {
    Object.assign(cur, d); Object.assign(byId(DB.chapters, cur.id) || {}, d);
    renderChapters(); setStatus('已更新');
  }).catch(function (e) { setStatus(e.message, 'err'); });
}
function newChapter() {
  var title = prompt('新章節標題（可留空）') ; if (title === null) return;
  setStatus('建立中…');
  apiPost('createChapter', { title:title || '未命名', status:'構思' }).then(function (j) {
    return loadAll().then(function () { openChapter(j.result.id); });
  }).catch(function (e) { setStatus(e.message, 'err'); });
}
function deleteChapter() {
  if (!cur) return;
  if (!confirm('刪除「' + cur.title + '」？Sheet 那列會刪掉，Doc 會進垃圾桶。')) return;
  apiPost('deleteChapter', { id:cur.id }).then(function () { cur = null; dirty = false; return loadAll(); }).catch(function (e) { setStatus(e.message, 'err'); });
}
function moveChapter(dir) {
  if (!cur) return;
  var ids = DB.chapters.map(function (c) { return c.id; });
  var i = ids.indexOf(cur.id), j = i + dir;
  if (j < 0 || j >= ids.length) return;
  ids.splice(i, 1); ids.splice(j, 0, cur.id);
  setStatus('排序中…');
  apiPost('reorder', { ids:ids }).then(loadAll).catch(function (e) { setStatus(e.message, 'err'); });
}
function pullDoc() {
  if (!cur) return;
  if (dirty && !confirm('目前有未存的修改，載入 Doc 會蓋掉。繼續？')) return;
  setStatus('從 Doc 讀取…');
  apiPost('pullFromDoc', { id:cur.id }).then(function (j) {
    cur.body = j.result.body; cur.word_count = j.result.word_count; cur.doc_newer = false;
    fillEditor(); dirty = false; hideBanner(); setStatus('已載入 Doc 版本'); loadAll();
  }).catch(function (e) { setStatus(e.message, 'err'); });
}
function hideBanner() { document.getElementById('docBanner').classList.remove('show'); }

// ══════════ 右欄 ══════════
function showPane(name) {
  document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.pane === name); });
  document.querySelectorAll('.pane').forEach(function (p) { p.classList.toggle('on', p.id === 'pane-' + name); });
}
function byId(arr, id) { return arr.filter(function (x) { return String(x.id) === String(id); })[0]; }
function card(opts) {
  var d = document.createElement('div'); d.className = 'card' + (opts.done ? ' done' : '');
  d.innerHTML = '<h4></h4><div class="sub"></div><div class="body"></div><div class="acts"><button>編輯</button></div>';
  d.querySelector('h4').innerHTML = (opts.cat ? '<span class="cat"></span>' : '') + '<span class="nm"></span>';
  if (opts.cat) d.querySelector('.cat').textContent = opts.cat;
  d.querySelector('.nm').textContent = opts.title;
  d.querySelector('.sub').textContent = opts.sub || '';
  d.querySelector('.body').textContent = opts.body || '';
  d.onclick = function (e) { if (e.target.tagName !== 'BUTTON') d.classList.toggle('open'); };
  d.querySelector('.acts button').onclick = function () { editCard(opts.tab, opts.rec); };
  if (opts.extra) d.querySelector('.acts').appendChild(opts.extra);
  return d;
}
function renderChars(q) {
  var el = document.getElementById('charList'); el.innerHTML = '';
  q = (q || '').toLowerCase();
  DB.characters.filter(function (c) { return !q || (c.name + c.role + c.summary + c.notes).toLowerCase().indexOf(q) !== -1; })
    .forEach(function (c) { el.appendChild(card({ tab:'characters', rec:c, title:c.name, sub:c.role, body:(c.summary || '') + (c.notes ? '\n\n' + c.notes : '') })); });
}
function renderWorld() {
  var sel = document.getElementById('worldCat');
  var cats = []; DB.world.forEach(function (w) { if (w.category && cats.indexOf(w.category) === -1) cats.push(w.category); });
  var keep = sel.value; sel.innerHTML = '<option value="">全部類別</option>' + cats.map(function (c) { return '<option>' + c + '</option>'; }).join(''); sel.value = keep;
  var q = document.getElementById('worldQ').value.toLowerCase();
  var el = document.getElementById('worldList'); el.innerHTML = '';
  DB.world.filter(function (w) { return (!keep || w.category === keep) && (!q || (w.name + w.content).toLowerCase().indexOf(q) !== -1); })
    .forEach(function (w) { el.appendChild(card({ tab:'world', rec:w, cat:w.category, title:w.name, body:w.content })); });
}
function renderThreads() {
  var scope = document.getElementById('threadScope').value;
  var el = document.getElementById('threadList'); el.innerHTML = '';
  DB.threads.filter(function (t) {
    if (scope === 'open') return !isTrue(t.resolved);
    if (scope === 'chapter') return cur && String(t.chapter_id) === String(cur.id);
    return true;
  }).forEach(function (t) {
    var ch = byId(DB.chapters, t.chapter_id);
    var btn = document.createElement('button'); btn.textContent = isTrue(t.resolved) ? '標回未收' : '已收';
    btn.onclick = function () {
      apiPost('saveThread', { id:t.id, resolved:!isTrue(t.resolved), resolved_chapter: isTrue(t.resolved) ? '' : (cur ? cur.id : '') })
        .then(function () { t.resolved = !isTrue(t.resolved); renderThreads(); }).catch(function (e) { setStatus(e.message, 'err'); });
    };
    el.appendChild(card({ tab:'threads', rec:t, done:isTrue(t.resolved), title:String(t.content).slice(0, 40), sub:(ch ? '第' + pad(ch.order) + '章 ' + ch.title : ''), body:t.content, extra:btn }));
  });
}
function isTrue(v) { return v === true || String(v).toUpperCase() === 'TRUE'; }

function renderLog() {
  // 日曆
  var cal = document.getElementById('cal'); cal.innerHTML = '';
  var byDay = {};
  DB.log.forEach(function (l) { var d = String(l.date).slice(0, 10); byDay[d] = (byDay[d] || 0) + Math.max(0, Number(l.words_delta) || 0); });
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var start = new Date(today); start.setDate(start.getDate() - start.getDay() - 12 * 7);
  var cells = [];
  for (var d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    var key = d.toLocaleDateString('sv-SE'), n = byDay[key] || 0;
    var lvl = n === 0 ? '' : n < 300 ? 'l1' : n < 800 ? 'l2' : n < 1500 ? 'l3' : 'l4';
    cells.push({ key:key, n:n, lvl:lvl, dow:d.getDay() });
  }
  // 以「週」為欄、星期為列
  var weeks = []; cells.forEach(function (c) { if (c.dow === 0 || !weeks.length) weeks.push([]); weeks[weeks.length - 1].push(c); });
  cal.style.gridTemplateColumns = 'repeat(' + weeks.length + ',1fr)';
  cal.style.gridAutoFlow = 'column'; cal.style.gridTemplateRows = 'repeat(7,1fr)';
  weeks.forEach(function (w) { for (var i = 0; i < 7; i++) { var c = w[i]; var s = document.createElement('i'); if (c) { s.className = c.lvl; s.title = c.key + '：' + c.n + ' 字'; } else s.style.visibility = 'hidden'; cal.appendChild(s); } });
  // 列表
  var el = document.getElementById('logList'); el.innerHTML = '';
  DB.log.slice().sort(function (a, b) { return String(b.created_at || b.date).localeCompare(String(a.created_at || a.date)); }).slice(0, 40).forEach(function (l) {
    var ch = byId(DB.chapters, l.chapter_id), n = Number(l.words_delta) || 0;
    var d = document.createElement('div'); d.className = 'log';
    d.innerHTML = '<span class="d"></span><b class="' + (n < 0 ? 'neg' : '') + '"></b> <span class="c"></span><div class="note" style="color:var(--muted)"></div>';
    d.querySelector('.d').textContent = String(l.date).slice(5, 10);
    d.querySelector('b').textContent = n ? (n > 0 ? '+' : '') + n : '';
    d.querySelector('.c').textContent = ch ? ch.title : '';
    d.querySelector('.note').textContent = l.note || '';
    el.appendChild(d);
  });
}
function addNote() {
  var note = document.getElementById('logNote').value.trim(); if (!note) return;
  apiPost('addLog', { chapter_id:cur ? cur.id : '', words_delta:0, note:note }).then(function () {
    document.getElementById('logNote').value = ''; return loadAll();
  }).catch(function (e) { setStatus(e.message, 'err'); });
}

// ══════════ 卡片編輯（角色／世界／伏筆） ══════════
var FORMS = {
  characters: [['name','姓名'],['role','角色定位'],['summary','設定（驅動力、目標、掙扎）','ta'],['notes','備註（血型、外貌、關係…）','ta'],['first_chapter','初登場章']],
  world:      [['category','類別'],['name','名稱'],['content','內容','ta']],
  threads:    [['content','內容','ta'],['chapter_id','所屬章節','ch']]
};
var ACTIONS = { characters:['saveCharacter','deleteCharacter'], world:['saveWorld','deleteWorld'], threads:['saveThread','deleteThread'] };
var editing = null;
function editCard(tab, rec) {
  editing = { tab:tab, rec:rec || {} };
  document.getElementById('cardTitle').textContent = (rec ? '編輯' : '新增') + { characters:'角色', world:'世界觀', threads:'伏筆' }[tab];
  var f = document.getElementById('cardForm'); f.innerHTML = '';
  FORMS[tab].forEach(function (fd) {
    var l = document.createElement('label'); l.textContent = fd[1]; f.appendChild(l);
    var inp;
    if (fd[2] === 'ta') { inp = document.createElement('textarea'); inp.rows = 5; }
    else if (fd[2] === 'ch') { inp = document.createElement('select'); inp.innerHTML = '<option value="">（不指定）</option>' + DB.chapters.map(function (c) { return '<option value="' + c.id + '">第' + pad(c.order) + '章 ' + c.title + '</option>'; }).join(''); }
    else inp = document.createElement('input');
    inp.id = 'f_' + fd[0]; inp.value = editing.rec[fd[0]] !== undefined ? editing.rec[fd[0]] : (fd[0] === 'chapter_id' && cur ? cur.id : '');
    f.appendChild(inp);
  });
  document.getElementById('cardDel').style.visibility = rec ? 'visible' : 'hidden';
  document.getElementById('cardModal').classList.add('show');
}
function closeCard() { document.getElementById('cardModal').classList.remove('show'); editing = null; }
function saveCard() {
  var d = { id:editing.rec.id };
  FORMS[editing.tab].forEach(function (fd) { d[fd[0]] = document.getElementById('f_' + fd[0]).value; });
  if (editing.tab === 'threads' && !editing.rec.id) d.resolved = false;
  apiPost(ACTIONS[editing.tab][0], d).then(function () { closeCard(); return loadAll(); }).catch(function (e) { alert(e.message); });
}
function deleteCard() {
  if (!confirm('確定刪除？')) return;
  apiPost(ACTIONS[editing.tab][1], { id:editing.rec.id }).then(function () { closeCard(); return loadAll(); }).catch(function (e) { alert(e.message); });
}

// ══════════ 其他 ══════════
function toggleFocus() { document.getElementById('app').classList.toggle('focus'); }
function zoom(d) { fontSize = Math.max(14, Math.min(26, fontSize + d)); sheet.style.fontSize = fontSize + 'px'; localStorage.setItem('loom_font', fontSize); }
document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  if (e.key.toLowerCase() === 'f' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement !== sheet) toggleFocus();
});
window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

// 啟動
if (pass) loadAll(); else document.getElementById('passModal').classList.add('show');
</script>
